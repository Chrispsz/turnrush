[workspace]
resolver = "2"
members = ["crates/turnrush-core", "crates/turnrush-sim", "crates/turnrush-game"]

[workspace.package]
version = "0.7.1"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"  # fat LTO tornava builds do Bevy lentos demais; thin mantém perf
codegen-units = 1

# Sandbox com pouco disco: sem debuginfo e sem incremental no dev.
[profile.dev]
debug = false
incremental = false
